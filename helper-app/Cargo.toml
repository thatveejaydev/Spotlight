[package]
name = "premiere-spotlight"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight Rust + Slint Spotlight effect launcher for Adobe Premiere Pro"

[dependencies]
slint = { version = "1.9", default-features = false, features = [
    "compat-1-2",
    "std",
    "backend-winit",
    "renderer-software",
    "raw-window-handle-06",
    "unstable-winit-030",
] }
global-hotkey = "0.6"
nucleo-matcher = "0.3"
raw-window-handle = "0.6"
tungstenite = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
